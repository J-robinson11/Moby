name: CI checks

# Fast sanity checks on every push so broken code never reaches a scheduled run.
on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile-check the script
        run: python -m py_compile moby.py

      - name: Run test suite (no network, no API calls)
        run: pytest -q
