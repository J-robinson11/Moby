name: Moby

# Runs the smart-money scan 3x/day in the cloud — no local machine needed.
# NOTE: GitHub Actions cron is in UTC and does NOT observe Daylight Saving.
# GitHub's free scheduler typically fires ~1 hour LATE under load, so these
# times are intentionally set ~1h10m EARLIER than the target delivery time and
# off the top of the hour (:20) to reduce congestion/drift.
# Nominal fire (UTC) -> expected delivery (CDT = UTC-5, ~1h drift):
#   11:20 UTC -> ~7:20 AM CT | 16:20 UTC -> ~12:20 PM CT | 21:20 UTC -> ~5:20 PM CT
on:
  schedule:
    - cron: "20 11,16,21 * * *"
  workflow_dispatch:      # manual run from the Actions tab
    inputs:
      dry_run:
        description: "Set to 1 to print the slate instead of posting to Discord"
        required: false
        default: "0"
      test:
        description: "Set to 1 to post with a 🧪 TEST badge and skip signal logging"
        required: false
        default: "0"

jobs:
  moby:
    runs-on: ubuntu-latest
    # Generous budget for Batch API polling (public repo: minutes are free);
    # a stuck batch is cancelled at BATCH_WAIT_MIN (20) + direct fallback.
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bring the running track record in from the dedicated `data` branch so
      # grading has history. `main` no longer stores the log (it's .gitignored),
      # so this is where signals_log.jsonl comes from at runtime.
      - name: Restore signals log from data branch
        run: |
          if git fetch origin data 2>/dev/null && git show FETCH_HEAD:signals_log.jsonl > signals_log.jsonl 2>/dev/null; then
            echo "Restored signals_log.jsonl from data branch ($(wc -l < signals_log.jsonl) lines)."
          else
            echo "No data branch/log yet — starting with an empty track record."
            rm -f signals_log.jsonl
          fi

      - name: Run Moby
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # --- Alert channel: set ONE. Discord (free) is the default. ---
          # Per-sport webhooks fall back to legacy DISCORD_WEBHOOK_URL when the
          # secret is unset (empty string counts as unset), so this is harmless
          # to wire before the WNBA channel exists.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_WNBA: ${{ secrets.DISCORD_WEBHOOK_URL_WNBA }}
          DISCORD_WEBHOOK_URL_UFC: ${{ secrets.DISCORD_WEBHOOK_URL_UFC }}
          DISCORD_WEBHOOK_URL_NFL: ${{ secrets.DISCORD_WEBHOOK_URL_NFL }}
          DISCORD_WEBHOOK_URL_NBA: ${{ secrets.DISCORD_WEBHOOK_URL_NBA }}
          DISCORD_WEBHOOK_URL_MLB: ${{ secrets.DISCORD_WEBHOOK_URL_MLB }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO_PHONE: ${{ secrets.ALERT_TO_PHONE }}
          # --- Multi-sport / model tiers ---
          # All sports enabled; the season gate keeps dark sports at $0 (a
          # sport only runs when it has live/upcoming games in the window).
          MOBY_SPORTS: "soccer,wnba,ufc,nfl,nba,mlb"
          BATCH_MODE: "1"
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}   # legacy synth override, honored if set
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          TEST_RUN: ${{ github.event.inputs.test || '0' }}
          # Optional overrides (uncomment to change):
          # MODEL_SYNTH: claude-sonnet-4-6
          # MODEL_NEWS: claude-haiku-4-5-20251001
          # PREFILTER_TOP_N: "30"
          # MARKET_TAG: world-cup
          # MARKET_CAP: "40"
          # MIN_SMART_MONEY_USD: "2000"
        run: python moby.py

      # Persist the updated track record to the dedicated `data` branch (NOT main).
      # The full cumulative log lives in one file, so a single-commit force-push
      # keeps the branch tiny. Uses the default GITHUB_TOKEN — `data` is
      # unprotected, so no PAT or ruleset bypass is needed, leaving `main` locked.
      # Guarded to main so branch validation runs never pollute the real
      # track record.
      - name: Persist signals log to data branch
        if: success() && github.ref_name == 'main'
        run: |
          if [ ! -f signals_log.jsonl ]; then
            echo "No signals_log.jsonl to persist."; exit 0
          fi
          git config user.email "moby@bot"
          git config user.name "Moby"
          work="$(mktemp -d)"
          cp signals_log.jsonl "$work/signals_log.jsonl"
          git -C "$work" init -q
          git -C "$work" config user.email "moby@bot"
          git -C "$work" config user.name "Moby"
          git -C "$work" checkout -q -b data
          git -C "$work" add signals_log.jsonl
          git -C "$work" commit -q -m "chore: log smart-money signals"
          git -C "$work" push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "Pushed updated log to data branch."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Notify Discord if any step above failed, so you know to check the logs.
      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGER: ${{ github.event_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          SHORT_SHA="${GITHUB_SHA:0:7}"
          NOW_UTC="$(date -u '+%Y-%m-%d %H:%M UTC')"
          COMMIT_LINE="$(printf '%s' "$COMMIT_MSG" | head -n1)"
          jq -n \
            --arg run_url "$RUN_URL" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$RUN_ATTEMPT" \
            --arg trigger "$TRIGGER" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$SHORT_SHA" \
            --arg commit "$COMMIT_LINE" \
            --arg now "$NOW_UTC" \
            '{
              username: "Moby",
              embeds: [{
                title: "⚠️ Moby run FAILED",
                description: ("The scheduled Moby job did not complete. No alert was sent this run — check the logs and fix.\n\n**[➡ Open the run logs](" + $run_url + ")**"),
                color: 15158332,
                fields: [
                  {name: "Repository", value: $repo, inline: true},
                  {name: "Run #",      value: ("`" + $run_id + "`  (attempt " + $attempt + ")"), inline: true},
                  {name: "Triggered by", value: $trigger, inline: true},
                  {name: "Branch",     value: $branch, inline: true},
                  {name: "Commit",     value: ("`" + $sha + "`"), inline: true},
                  {name: "Failed at",  value: $now, inline: true},
                  {name: "Latest commit", value: (if $commit == "" then "n/a" else $commit end), inline: false},
                  {name: "Likely causes", value: "• Anthropic API error or out of credit\n• Polymarket Gamma/Data API hiccup\n• Model output could not be parsed as JSON", inline: false}
                ],
                footer: {text: "Moby · automated failure alert"}
              }]
            }' \
          | curl -sf -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
